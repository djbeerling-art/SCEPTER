<text class="p" x="6" y="24">(a)</text><text class="h" x="44" y="24">One model run: inputs, driver, SCEPTER core, outputs</text>

<!-- inputs -->
<text class="t b" x="6" y="56">Site and management inputs</text>
<rect class="box" x="6" y="66" width="476" height="76" rx="6"/>
<text class="t" x="18" y="88">Soil</text>
<text class="s" x="18" y="110">CEC, reducible Fe(III), OM input, calcite,</text>
<text class="s" x="18" y="131">pH (irrigation alkalinity), percolation q</text>
<rect class="box" x="6" y="148" width="476" height="54" rx="6"/>
<text class="t" x="18" y="170">Climate</text><text class="s" x="18" y="192">season soil temperature (Q10 rates)</text>
<rect class="box" x="6" y="208" width="476" height="96" rx="6"/>
<text class="t" x="18" y="230">Rock</text>
<text class="s" x="18" y="252">whole-rock oxides → mineral recipe, 80–100 µm,</text>
<text class="s" x="18" y="273">mixed 0–0.15 m; rate scaling mafic ×0.45,</text>
<text class="s" x="18" y="294">feldspar ×0.25, amorphous silica ×30</text>
<rect class="box" x="6" y="310" width="476" height="96" rx="6"/>
<text class="t" x="18" y="332">Management</text>
<text class="s" x="18" y="354">basalt dose; continuous flooding or AWD;</text>
<text class="s" x="18" y="375">urea 120 kg N ha⁻¹; tillage 0.2 m;</text>
<text class="s" x="18" y="396">OM 60% as residue; Fe(III) 0.3 mol m⁻² yr⁻¹</text>

<!-- driver -->
<path class="ar" d="M484,236 L498,236"/>
<rect class="box" x="500" y="66" width="495" height="350" rx="6"/>
<text class="t b" x="514" y="88">Python driver</text>
<text class="m" x="514" y="110">paddy/run_flooded_column.py</text>
<text class="s" x="514" y="136">writes one SCEPTER input file per paddy</text>
<text class="s" x="514" y="157">process (list in Appendix A); absent file</text>
<text class="s" x="514" y="178">= process off, so the upland setup is</text>
<text class="s" x="514" y="199">unchanged. Run flags: --season / --fallow,</text>
<text class="s" x="514" y="220">--awd, --phd=14, --basalt=dose, --rstrt</text>
<rect x="512" y="238" width="471" height="166" rx="6" fill="#fff8e6" stroke="#d69a1e" stroke-width="1.4"/>
<text class="t b" x="524" y="262">Frozen v22 (all runs in this paper)</text>
<text class="m" x="524" y="286">scepter_paddy_v22, commit 162913a</text>
<text class="m" x="524" y="308">k_cal.in: CH₄ vmax 1860 yr⁻¹</text>
<text class="m" x="524" y="330">--rtsi=2e-3:2.7e-4:0.2</text>
<text class="s" x="524" y="356">no recalibration between sites</text>
<text class="s" x="524" y="380">(Fig. 3 rerun on v23: carbon-closure fix)</text>
<path class="ar" d="M600,416 L600,428"/>

<!-- core -->
<rect class="core" x="6" y="430" width="644" height="456" rx="8"/>
<text class="t b" x="20" y="454">SCEPTER v1.0 core (Fortran 90)</text>
<text class="s" x="20" y="476">Kanzaki et al. 2022, 2024; implicit Newton solver</text>
<g>
 <rect class="box" x="20" y="490" width="304" height="56" rx="5"/><text class="t" x="32" y="512">transport</text><text class="s" x="32" y="534">advection, diffusion</text>
 <rect class="box" x="332" y="490" width="304" height="56" rx="5"/><text class="t" x="344" y="512">mineral kinetics</text><text class="s" x="344" y="534">rate laws, Ω, grain size</text>
 <rect class="box" x="20" y="552" width="304" height="56" rx="5"/><text class="t" x="32" y="574">cation exchange</text><text class="s" x="32" y="596">CEC, selectivities</text>
 <rect class="box" x="332" y="552" width="304" height="56" rx="5"/><text class="t" x="344" y="574">pH and speciation</text><text class="s" x="344" y="596">charge balance</text>
</g>
<rect class="new" x="20" y="620" width="616" height="254" rx="8"/>
<text class="t b" x="34" y="644" style="fill:#14704f">Paddy extensions (switchable)</text>
<g class="s">
 <text x="34" y="668">• microbial redox: O₂, NO₃⁻, Fe(III), SO₄²⁻, CH₄</text>
 <text x="34" y="689">• Fe phases: green rust, goethite, siderite, FeS</text>
 <text x="34" y="710">• N cycle: urea, nitrification, pH-dependent N₂O</text>
 <text x="34" y="731">• gas exits: plant transport, ebullition, floodwater</text>
 <text x="34" y="752">• plant terms: root respiration, O₂ loss, NH₄⁺/Si uptake</text>
 <text x="48" y="773" style="fill:#9b6b0a">Si feedback on root O₂ loss: empirical (--rtsi)</text>
 <text x="34" y="794">• plough pan, subsoil saturation, base open to air</text>
 <text x="34" y="815">• Q10 temperature factors; speciation cache</text>
 <text x="34" y="836">• Fe(III) supply and OM allocation</text>
 <text x="34" y="862" style="fill:#14704f">Equations 3–12; full list in Appendix A</text>
</g>

<text class="s" x="682" y="495">by process (mol m⁻² yr⁻¹)</text>
<text class="s" x="682" y="518">prof/: depth profiles</text>
<text class="s" x="682" y="541">restart state for next run</text>
<path class="ar" d="M831,552 L831,566"/>
<rect class="box" x="668" y="568" width="327" height="168" rx="6"/>

<rect class="box" x="668" y="750" width="327" height="136" rx="6"/>

<text class="s" x="682" y="817">PHREEQC re-speciation;</text>
<text class="s" x="682" y="838">element mass balance</text>

<text class="p" x="6" y="922">(b)</text><text class="h" x="44" y="922">Simulation protocol and post-processing</text>

<rect class="box" x="6" y="966" width="200" height="80" rx="6"/>

<path class="ar" d="M802,1028 L820,1028"/>
<rect class="box" x="822" y="990" width="161" height="76" rx="5"/><text class="t" x="834" y="1012">fallow 252 d</text><text class="s" x="834" y="1034">drained,</text><text class="s" x="834" y="1055">plants off</text>

<rect class="box" x="6" y="1134" width="489" height="170" rx="6"/>

 <text x="517" y="1222">Wang 2014, Gong, Park, Uchibayashi, Wang 2024;</text>
 <text x="517" y="1243">amendment at reported depth (Gong 0.086 m)</text>
 <text x="517" y="1267">Applications (Sect. 4): reference site +</text>
 <text x="517" y="1288">six area-weighted archetypes</text>
</g>
