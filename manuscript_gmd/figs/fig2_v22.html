<svg id="fig" width="1000" height="1404" viewBox="0 0 1000 1404" xmlns="http://www.w3.org/2000/svg">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#52514e"/></marker>
</defs>

<text class="p" x="8" y="24">(a)</text><text class="h" x="42" y="24">One model run: inputs, driver, SCEPTER core with paddy extensions, outputs</text>

<!-- inputs -->
<text class="t b" x="10" y="54">Site and management inputs</text>
<rect class="box" x="10" y="64" width="470" height="84" rx="6"/>
<text class="t" x="22" y="84">Soil</text>
<text class="s" x="22" y="103">CEC, reducible Fe(III), OM input, calcite, pH</text>
<text class="s" x="22" y="121">(irrigation alkalinity), percolation q</text>
<text class="s" x="22" y="139">(per test site or archetype)</text>
<rect class="box" x="10" y="154" width="470" height="48" rx="6"/>
<text class="t" x="22" y="174">Climate</text><text class="s" x="22" y="193">season soil temperature (Q10 rates)</text>
<rect class="box" x="10" y="208" width="470" height="84" rx="6"/>
<text class="t" x="22" y="228">Rock</text>
<text class="s" x="22" y="247">whole-rock oxides → mineral recipe; 80–100 µm;</text>
<text class="s" x="22" y="265">mixed 0–0.15 m; rate scaling mafic ×0.45,</text>
<text class="s" x="22" y="283">feldspar ×0.25, amorphous silica ×30</text>
<rect class="box" x="10" y="298" width="470" height="84" rx="6"/>
<text class="t" x="22" y="318">Management</text>
<text class="s" x="22" y="337">basalt dose, continuous flooding or AWD,</text>
<text class="s" x="22" y="355">urea 120 kg N ha⁻¹, tillage depth 0.2 m,</text>
<text class="s" x="22" y="373">OM 60% as residue in 0–0.2 m; Fe(III) 0.3 mol m⁻² yr⁻¹</text>
<rect x="10" y="388" width="470" height="100" rx="6" fill="#fff8e6" stroke="#d69a1e" stroke-width="1.4"/>
<text class="t b" x="22" y="408">Frozen v22 (all runs in this paper)</text>
<text class="m" x="22" y="427">scepter_paddy_v22, commit 162913a</text>
<text class="m" x="22" y="445">k_cal.in: CH₄ vmax 1860 yr⁻¹</text>
<text class="m" x="22" y="463">--rtsi=2e-3:2.7e-4:0.2</text>
<text class="s" x="22" y="481">no recalibration between sites</text>

<!-- driver -->
<path class="ar" d="M482,276 L518,276"/>
<rect class="box" x="520" y="64" width="475" height="424" rx="6"/>
<text class="t b" x="534" y="86">Python driver</text>
<text class="m" x="534" y="106">paddy/run_flooded_column.py</text>
<text class="s" x="534" y="130">writes the SCEPTER input files:</text>
<g class="m">
 <text x="540" y="152">frame.in, switches.in</text>
 <text x="540" y="170">slds/solutes/gases.in</text>
 <text x="540" y="188">extrxns.in, krxn_ext.in</text>
 <text x="540" y="206">dust.in, psdrain.in</text>
 <text x="540" y="224">OM_rain.in, rain.in</text>
 <text x="540" y="242">Wet_temp.in</text>
 <text x="770" y="152">T_temp.in, q_temp.in</text>
 <text x="770" y="170">floodwater.in, pox.in</text>
 <text x="770" y="188">rtsi.in, n2oy.in</text>
 <text x="770" y="206">o2inh.in, cec.in</text>
 <text x="770" y="224">kinscale.in, pan.in</text>
 <text x="770" y="242">omalloc.in</text>
</g>
<text class="s" x="534" y="270">(dust/psdrain = basalt, rain = urea, Wet_temp = flood/drain)</text>
<text class="s" x="534" y="300">--season / --fallow, --awd, --phd=14,</text>
<text class="s" x="534" y="318">--basalt=dose, --rstrt=previous run</text>
<text class="s" x="534" y="348">Each paddy term reads its own small input</text>
<text class="s" x="534" y="366">file; absent file = term off, so the upland</text>
<text class="s" x="534" y="384">SCEPTER setup is unchanged.</text>
<path class="ar" d="M600,488 L600,518"/>

<!-- core -->
<rect class="core" x="10" y="520" width="640" height="470" rx="8"/>
<text class="t b" x="24" y="544">SCEPTER v1.0 core (Fortran 90)</text>
<text class="s" x="24" y="563">Kanzaki et al. 2022, 2024; implicit Newton solver per time step</text>
<g>
 <rect class="box" x="24" y="576" width="300" height="52" rx="5"/><text class="t" x="36" y="597">transport</text><text class="s" x="36" y="616">advection, diffusion (aq + gas)</text>
 <rect class="box" x="336" y="576" width="300" height="52" rx="5"/><text class="t" x="348" y="597">mineral kinetics</text><text class="s" x="348" y="616">rate laws, Ω, grain-size PSD</text>
 <rect class="box" x="24" y="636" width="300" height="52" rx="5"/><text class="t" x="36" y="657">cation exchange</text><text class="s" x="36" y="676">CEC, selectivities</text>
 <rect class="box" x="336" y="636" width="300" height="52" rx="5"/><text class="t" x="348" y="657">pH and speciation</text><text class="s" x="348" y="676">charge balance, ideal solution</text>
</g>
<rect class="new" x="24" y="700" width="612" height="276" rx="8"/>
<text class="t b" x="38" y="724" style="fill:#14704f">Paddy extensions (switchable; makefile_paddy)</text>
<g class="s">
 <text x="38" y="748">• microbial redox: O₂, NO₃⁻, Fe(III), SO₄²⁻, CH₄; CH₄ oxidation</text>
 <text x="38" y="767">• Fe phases: green rust, goethite, siderite, FeS; O₂ re-oxidation</text>
 <text x="38" y="786">• N cycle: urea hydrolysis, nitrification, pH-dependent N₂O yield</text>
 <text x="38" y="805">• gas exits: plant transport + rhizosphere oxidation, ebullition,</text>
 <text x="50" y="824">floodwater exchange</text>
 <text x="38" y="843">• plant terms: root respiration, radial O₂ loss, NH₄⁺/Si uptake;</text>
 <text x="50" y="862" style="fill:#9b6b0a">Si feedback on root O₂ loss: empirical, switchable (--rtsi)</text>
 <text x="38" y="881">• water regime: saturation from surface schedule; plough pan</text>
 <text x="50" y="900">(diffusivity ×0.1, 0.20–0.24 m), base open to air (--pan)</text>
 <text x="38" y="919">• Q10 temperature factors; speciation cache (~25× faster)</text>
 <text x="38" y="938">• Fe(III) supply and OM allocation (--fe3in, --omalloc)</text>
 <text x="38" y="964" style="fill:#14704f">Equations 3–12; full list in Appendix A</text>
</g>

<!-- outputs -->
<path class="ar" d="M652,600 L668,600"/>
<rect class="box" x="670" y="520" width="325" height="140" rx="6"/>
<text class="t b" x="684" y="542">Model output</text>
<text class="s" x="684" y="562">flx/: column-integrated fluxes of</text>
<text class="s" x="684" y="580">every species by process</text>
<text class="s" x="684" y="602">prof/: depth profiles of solids,</text>
<text class="s" x="684" y="620">solutes, gases, pH, saturation</text>
<text class="s" x="684" y="644">restart state for the next run</text>
<path class="ar" d="M832,660 L832,678"/>
<rect class="box" x="670" y="680" width="325" height="160" rx="6"/>
<text class="t b" x="684" y="702">GHG budget</text><text class="m" x="684" y="722">paddy/ghg_budget.py</text>
<text class="s" x="684" y="744">CH₄, N₂O, CO₂ degassing, alkalinity</text>
<text class="s" x="684" y="762">export, calcite, cation release</text>
<text class="s" x="684" y="786">net: ΔCH₄ + ΔN₂O − ΔPDA − Δcalcite</text>
<text class="s" x="684" y="804">PDA = ALK − 2Fe(II) − 2NH₄⁺ at base</text>
<text class="s" x="684" y="826">(t CO₂e ha⁻¹, GWP100)</text>
<rect class="box" x="670" y="852" width="325" height="96" rx="6"/>
<text class="t b" x="684" y="874">Verification</text><text class="m" x="684" y="894">paddy/verification/</text>
<text class="s" x="684" y="916">PHREEQC re-speciation,</text><text class="s" x="684" y="934">element mass balance (Fig. 3)</text>

<!-- ===================== b: protocol ===================== -->
<text class="p" x="8" y="1022">(b)</text><text class="h" x="42" y="1022">Simulation protocol and post-processing</text>
<text class="m" x="10" y="1044">paddy/multiyear/run_chain.sh (resumable; one status line per season and fallow)</text>
<rect class="box" x="10" y="1066" width="205" height="74" rx="6"/>
<text class="t" x="22" y="1088">spin-up</text><text class="s" x="22" y="1108">3 yr drained, no rock;</text><text class="s" x="22" y="1126">fills OM and Fe pools</text>
<path class="ar" d="M217,1103 L243,1103"/>
<rect class="box" x="245" y="1066" width="205" height="74" rx="6"/>
<text class="t" x="257" y="1088">settle</text><text class="s" x="257" y="1108">7 yr season + fallow,</text><text class="s" x="257" y="1126">no rock (settled state)</text>
<path class="ar" d="M452,1103 L478,1103"/>
<rect x="480" y="1056" width="515" height="146" rx="10" fill="#f4f8fd" stroke="#2a78d6" stroke-width="1.4"/>
<text class="s" x="492" y="1076" style="fill:#2a78d6">years 1–10: control and basalt chains, same settled start</text>
<rect class="box" x="492" y="1088" width="118" height="72" rx="5"/><text class="t" x="504" y="1110">tillage</text><text class="m" x="504" y="1130">till.py</text><text class="m" x="504" y="1148">0.2 m</text>
<path class="ar" d="M612,1123 L630,1123"/>
<rect class="box" x="632" y="1088" width="190" height="72" rx="5"/><text class="t" x="644" y="1110">season 113 d</text><text class="s" x="644" y="1130">rock, urea, OM;</text><text class="s" x="644" y="1148">plants on</text>
<path class="ar" d="M824,1123 L842,1123"/>
<rect class="box" x="844" y="1088" width="140" height="72" rx="5"/><text class="t" x="856" y="1110">fallow 252 d</text><text class="s" x="856" y="1130">drained,</text><text class="s" x="856" y="1148">plants off</text>
<path class="ar" d="M914,1160 C914,1180 551,1180 551,1163"/>
<text class="s" x="600" y="1196">next year restarts from the fallow end state</text>
<!-- budgets / evaluation / switches -->
<rect class="box" x="10" y="1214" width="320" height="184" rx="6"/>
<text class="t" x="22" y="1236">GHG and CDR budgets</text>
<g class="s">
 <text x="22" y="1256">treatment − control, year by year;</text>
 <text x="22" y="1274">season + fallow; GWP100 (CH₄ 27,</text>
 <text x="22" y="1292">N₂O 273); PDA export at the base;</text>
 <text x="22" y="1310">calcite only up to cations not</text>
 <text x="22" y="1328">exported; retained = potential CDR</text>
 <text x="22" y="1346">CH₄ also with Δ fixed at year 1</text>
 <text x="22" y="1364">(sensitivity, not a bound)</text>
</g>
<text class="m" x="22" y="1382">figcdr22.py --alk=pda</text>
<rect class="box" x="340" y="1214" width="320" height="184" rx="6"/>
<text class="t" x="352" y="1236">Evaluation runs (Sect. 3)</text>
<g class="s">
 <text x="352" y="1256">site soil spun up and settled as</text>
 <text x="352" y="1274">above, then one field season or a</text>
 <text x="352" y="1292">pot/batch run in a 0.3 m column:</text>
 <text x="352" y="1310">Wang 2014, Gong, Park, Uchibayashi,</text>
 <text x="352" y="1328">Wang 2024; amendment mixed to the</text>
 <text x="352" y="1346">reported depth (Gong 0.086 m)</text>
 <text x="352" y="1368">Applications (Sect. 4): reference</text>
 <text x="352" y="1386">site + six area-weighted archetypes</text>
</g>
<rect class="box" x="670" y="1214" width="325" height="184" rx="6"/>
<text class="t" x="682" y="1236">Model switches</text>
<text class="s" x="682" y="1254">flag → input file; absent = process off</text>
<g class="m pre">
 <text x="682" y="1274">--ch4 --n</text><text x="770" y="1274">CH₄ and N cycles</text>

</g>
