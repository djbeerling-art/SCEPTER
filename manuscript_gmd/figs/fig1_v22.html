<rect x="60" y="355" width="935" height="36" fill="#8f7b5f"/>
<rect x="60" y="391" width="935" height="234" fill="#b29e80"/>

<text class="t" x="66" y="324" style="fill:#3d3222;font-weight:600">puddled plough layer, 0–0.2 m</text>
<text class="s" x="66" y="342" style="fill:#3d3222">mixed before each season (tillage)</text>

<text class="s" x="78" y="571" style="fill:#7a5208">v22: K_Si = 2 mmol L⁻¹, w = 0.2</text>

<!-- ===================== b: redox network ===================== -->
<g transform="translate(0,10)">
<text class="p" x="8" y="700">(b)</text><text class="h" x="42" y="700">Microbial redox and Fe cycle</text>
<rect x="150" y="714" width="210" height="32" rx="6" fill="#efe7d8" stroke="#b29e80"/>
<text class="t" x="255" y="735" text-anchor="middle">organic matter (CH₂O)</text>
<path class="ar" d="M255,746 L255,770"/>
<text class="s" x="268" y="764">Monod in OM and acceptor (Eq. 3)</text>
<g>
 <rect class="box" x="10" y="772" width="480" height="46" rx="6"/>
 <text class="t" x="22" y="791">① O₂ → CO₂</text><text class="s" x="22" y="810">aerobic respiration; O₂ inhibits ②–⑤</text>
 <rect class="box" x="10" y="824" width="480" height="64" rx="6"/>
 <text class="t" x="22" y="843" style="fill:#6a3fb0">② NO₃⁻ → N₂O → N₂</text><text class="s" x="22" y="862">denitrification; pH-dependent N₂O yield (Eq. 7)</text>
 <text class="s" x="22" y="880">urea → NH₄⁺ → nitrification → NO₃⁻</text>
 <rect class="box" x="10" y="894" width="480" height="64" rx="6"/>
 <text class="t" x="22" y="913" style="fill:#9b4a14">③ Fe(III) → Fe²⁺</text><text class="s" x="22" y="932">ferrihydrite, green rust; goethite ~30× slower</text>
 <text class="s" x="22" y="950">NO₃⁻ inhibits ③–⑤</text>
 <rect class="box" x="10" y="964" width="480" height="46" rx="6"/>
 <text class="t" x="22" y="983">④ SO₄²⁻ → HS⁻ → FeS</text><text class="s" x="22" y="1002">sulfate reduction</text>
 <rect class="box" x="10" y="1016" width="480" height="46" rx="6"/>
 <text class="t" x="22" y="1035" style="fill:#a83a14">⑤ CH₂O → CH₄ + CO₂</text><text class="s" x="22" y="1054">inhibited by Fe(III) and SO₄²⁻ (Eq. 4); Q10 = 3</text>
</g>

<rect x="846" y="752" width="138" height="52" rx="5" fill="#fff" stroke="#cfcdc6"/><text class="s" x="915" y="774" text-anchor="middle">green rust</text><text class="s" x="915" y="793" text-anchor="middle">pH-stat (Eq. 5)</text>
<rect x="846" y="822" width="138" height="34" rx="5" fill="#fff" stroke="#cfcdc6"/><text class="s" x="915" y="844" text-anchor="middle">siderite, FeS</text>
<rect x="704" y="832" width="96" height="34" rx="5" fill="#fff" stroke="#cfcdc6"/><text class="s" x="752" y="854" text-anchor="middle">exchange</text>
<path class="ar" d="M654,779 L702,779"/><text class="s" x="678" y="756" text-anchor="middle" style="font-size:13px">reduction</text>
<path class="ar" d="M802,779 L844,779" style="marker-start:url(#a)"/>
<path class="ar" d="M790,798 C815,830 825,839 844,839"/>
<path class="ar" d="M752,798 L752,830" style="marker-start:url(#a)"/>
<path class="ox" d="M915,858 C915,905 600,905 590,800"/>

<text class="s" x="524" y="948" style="fill:#9b6b0a">green rust, siderite and FeS return to ferrihydrite</text>
<line x1="524" y1="968" x2="981" y2="968" stroke="#e2c7a6"/>
<text class="s" x="524" y="990">pH from charge balance at each Newton step;</text>
<text class="s" x="524" y="1008">reactions carry no H⁺ explicitly.</text>
<text class="s" x="524" y="1032">Microbial rates: Q10 = 2 (CH₄: 3) from 25 °C (Eq. 2).</text>
</g>
