<!doctype html>

<style>

<text class="s" x="640" y="380" style="fill:#f4efe6">diffusivity × 0.1</text>
<text class="t" x="66" y="418" style="fill:#2f2619;font-weight:600">subsoil</text>
<text class="s" x="66" y="439" style="fill:#2f2619">saturation ≤ 0.8;</text>
<text class="s" x="66" y="459" style="fill:#2f2619">base open to air</text>

</g>

<text class="s" x="78" y="534" style="fill:#9b6b0a;font-weight:600">EMPIRICAL, SWITCHABLE (--rtsi)</text>
<text class="s" x="78" y="556" style="fill:#7a5208">root O₂ loss rises with porewater Si</text>
<text class="s" x="78" y="578" style="fill:#7a5208">(Eq. 11); w = 0 switches it off</text>

<!-- ===================== b: redox network ===================== -->
<g transform="translate(0,12)">
<text class="p" x="6" y="700">(b)</text><text class="h" x="44" y="700">Microbial redox and Fe cycle</text>
<rect x="140" y="714" width="232" height="34" rx="6" fill="#efe7d8" stroke="#b29e80"/>
<text class="t" x="256" y="737" text-anchor="middle">organic matter (CH₂O)</text>
<path class="ar" d="M256,748 L256,772"/>
<text class="s" x="268" y="766">Monod kinetics (Eq. 3)</text>
<g>
 <rect class="box" x="6" y="774" width="486" height="50" rx="6"/>
 <text class="t" x="18" y="795">① O₂ → CO₂</text><text class="s" x="18" y="816">aerobic respiration; O₂ inhibits ②–⑤</text>
 <rect class="box" x="6" y="830" width="486" height="50" rx="6"/>
 <text class="t" x="18" y="851" style="fill:#6a3fb0">② NO₃⁻ → N₂O → N₂</text><text class="s" x="18" y="872">denitrification; pH-dependent N₂O yield</text>
 <rect class="box" x="6" y="886" width="486" height="50" rx="6"/>
 <text class="t" x="18" y="907" style="fill:#9b4a14">③ Fe(III) → Fe²⁺</text><text class="s" x="18" y="928">ferrihydrite, green rust; goethite slower</text>
 <rect class="box" x="6" y="942" width="486" height="50" rx="6"/>
 <text class="t" x="18" y="963">④ SO₄²⁻ → HS⁻ → FeS</text><text class="s" x="18" y="984">sulfate reduction</text>
 <rect class="box" x="6" y="998" width="486" height="50" rx="6"/>
 <text class="t" x="18" y="1019" style="fill:#a83a14">⑤ CH₂O → CH₄ + CO₂</text><text class="s" x="18" y="1040">inhibited by Fe(III) and SO₄²⁻ (Eq. 4)</text>
</g>

<rect x="508" y="714" width="487" height="334" rx="8" fill="#fbf3ea" stroke="#e2c7a6"/>

<rect x="708" y="768" width="92" height="36" rx="18" fill="#fff" stroke="#9b4a14"/><text class="t" x="754" y="792" text-anchor="middle">Fe²⁺</text>
<rect x="846" y="768" width="138" height="36" rx="5" fill="#fff" stroke="#cfcdc6"/><text class="s" x="915" y="792" text-anchor="middle">green rust</text>
<rect x="846" y="830" width="138" height="36" rx="5" fill="#fff" stroke="#cfcdc6"/><text class="s" x="915" y="854" text-anchor="middle">siderite, FeS</text>
<rect x="708" y="840" width="92" height="36" rx="5" fill="#fff" stroke="#cfcdc6"/><text class="s" x="754" y="864" text-anchor="middle">exchange</text>
<path class="ar" d="M654,786 L706,786"/><text class="s" x="680" y="762" text-anchor="middle" style="font-size:15px">reduction</text>

<path class="ar" d="M790,806 C815,838 825,848 844,848"/>

<text class="s" x="522" y="944" style="fill:#9b6b0a">O₂ on drainage and in fallow returns Fe²⁺,</text>
<text class="s" x="522" y="965" style="fill:#9b6b0a">green rust, siderite, FeS to ferrihydrite</text>
<line x1="522" y1="982" x2="981" y2="982" stroke="#e2c7a6"/>

<text class="s" x="522" y="1030">rates: Q10 = 2 (CH₄: 3) from 25 °C</text>
</g>
