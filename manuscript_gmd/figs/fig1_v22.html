<text class="p" x="1010" y="34">(b)</text><text class="h" x="1050" y="34">Microbial redox and Fe cycle</text>

 <text class="t" x="1045" y="314" style="fill:#9b4a14">③ Fe(III) → Fe²⁺</text><text class="s" x="1045" y="333">ferrihydrite, green rust; goethite ~30× slower</text>
 <text class="s" x="1045" y="351">NO₃⁻ inhibits ③–⑤</text>
 <rect class="box" x="1030" y="377" width="540" height="56" rx="6"/>

<rect x="1405" y="622" width="155" height="34" rx="5" fill="#fff" stroke="#cfcdc6"/><text class="s" x="1482" y="644" text-anchor="middle">siderite, FeS</text>
<rect x="1240" y="632" width="120" height="34" rx="5" fill="#fff" stroke="#cfcdc6"/><text class="s" x="1300" y="654" text-anchor="middle">exchange</text>
